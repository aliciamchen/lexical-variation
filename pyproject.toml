[project]
name = "lexical-variation"
version = "0.1.0"
description = "Multiplayer reference game experiment studying lexical variation and social signaling"
requires-python = ">=3.11"
dependencies = [
    # Tables and figures
    "numpy>=2.0",
    "pandas>=2.0",
    "matplotlib>=3.8",
    # Derived metrics: sentence embeddings, word frequency and tokenization
    "sentence-transformers>=3.0",
    "wordfreq>=3.0",
    "nltk>=3.8",
    # The message filter (Gemini on Vertex AI)
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.60",
    # The Prolific tooling
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["preprocessing", "report", "simulations", "operations"]
