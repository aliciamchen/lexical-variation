# Fast checks on every push: server unit tests (vitest) and the processed-data
# integrity suite. The Playwright end-to-end suite and the derived-metric tests
# (which import the sentence-transformer stack) run locally, not here.
name: ci

on:
  push:
  pull_request:

jobs:
  server-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: experiment/server/package-lock.json
      - name: Install server dependencies
        run: npm ci --prefix experiment/server
      - name: Run vitest
        run: npm run test --prefix experiment/server

  data-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Run the data integrity suite on the committed pilot data
        run: uv run --no-project --with pytest --with pandas --with numpy pytest analysis/test_data_integrity.py analysis/test_preprocessing.py -q
